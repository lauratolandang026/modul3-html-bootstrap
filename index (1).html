<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum Multimedia - Modul 3</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
  <style>
    body { padding-top: 40px; padding-bottom: 20px; background:#f5f5f5; }
    .container { max-width: 600px; }
    h2 { margin-bottom: 25px; }
    footer {
      margin-top: 40px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
      text-align: center;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Form Registrasi</h2>

    <form action="">
      <div class="col-sm-10">
        <div class="form-group">
          <label for="name"> Nama :</label>
          <input type="text" class="form-control" placeholder="Name" name="nama" required>
        </div>
        <div class="form-group">
          <label for="email">Email :</label>
          <input type="email" class="form-control" placeholder="Email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password :</label>
          <input type="password" class="form-control" placeholder="Password" name="Password" required>
        </div>
        <div class="form-group">
          <label for="jk">Jenis Kelamin:</label>
          <select class="form-control" id="jk">
            <option>Pria</option>
            <option>Wanita</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>

    <footer>
      <p>Nama: Laura Tolandang</p>
      <p>NIM&nbsp;&nbsp;&nbsp;: 240211060110</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/js/bootstrap.min.js"></script>
</body>
</html>
